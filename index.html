<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedSetup - Abrindo...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0f1117;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    .logo svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      font-weight: 600;
      color: #60a5fa;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      padding: 10px 20px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .offline-tip {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #2a2d3a;
      text-align: left;
    }
    .offline-tip p {
      font-size: 12px;
      margin-bottom: 8px;
    }
    .offline-tip code {
      background: #0f1117;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <h1>MedSetup</h1>
    <p id="desc">Conectando instantaneamente à sua plataforma de estudos...</p>
    
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Verificando servidor...</div>

    <div class="offline-tip" id="offlineTip">
      <p style="color: #f87171; font-weight: 600;">O servidor ainda não está respondendo.</p>
      <p>Clique no atalho <strong>"MedSetup"</strong> na sua Área de Trabalho para abrir automaticamente.</p>
      <button class="btn" onclick="checkServer()">Tentar Novamente</button>
    </div>
  </div>

  <script>
    const TARGET_URL = "http://localhost:3000";
    let attempts = 0;
    const maxAttempts = 12;

    async function checkServer() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);

        const response = await fetch(TARGET_URL + "/", {
          method: "HEAD",
          mode: "no-cors",
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        document.getElementById("status").textContent = "Abrindo agora...";
        document.getElementById("status").style.color = "#34d399";
        window.location.replace(TARGET_URL);
        return true;
      } catch (err) {
        attempts++;
        if (attempts >= maxAttempts) {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("status").style.display = "none";
          document.getElementById("offlineTip").style.display = "block";
          document.getElementById("desc").textContent = "Servidor offline.";
        } else {
          setTimeout(checkServer, 800);
        }
        return false;
      }
    }

    // Executa verificação imediata
    checkServer();
  </script>
</body>
</html>
